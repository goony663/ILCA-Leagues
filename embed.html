<!-- Embed code for the federation website (WordPress → WPBakery → Raw HTML element).
     Change PAGE to the page to show: index.html (landing), elite.html, ... -->
<iframe id="ilca-frame" src="https://goony663.github.io/ILCA-Leagues/index.html" title="תחרויות לאומיות – התאחדות הטיפוס"
        style="width:100%;border:0;min-height:1200px;display:block" loading="lazy"></iframe>
<script>
  window.addEventListener('message', function (e) {
    if (e.origin === 'https://goony663.github.io' && e.data && e.data.ilcaHeight) {
      document.getElementById('ilca-frame').style.height = e.data.ilcaHeight + 'px';
    }
  });
</script>
