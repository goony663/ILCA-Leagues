<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>תחרויות לאומיות – התאחדות הטיפוס</title>
<link rel="stylesheet" href="assets/site.css?v=20261117b">
</head>
<body>
<div class="wrap">

<header class="site-head">
  <div>
    <h1 class="disp">תחרויות לאומיות</h1>
    <div class="sub">עונת <span class="ltr">2026/27</span></div>
  </div>
  <img class="logo" src="assets/logo.svg" alt="התאחדות הטיפוס בישראל">
</header>

<div class="chyron" aria-label="עדכונים מהתחרויות">
  <div class="ch-lbl"><span class="disp">עדכונים</span></div>
  <div class="ch-gap" aria-hidden="true"></div>
  <div class="ch-bar" id="chbar" title="לחיצה עוצרת או ממשיכה את הגלילה">
    <div class="ch-in"><div class="ch-track" id="chtrack"></div></div>
  </div>
</div>

<div class="row2">
  <section class="main">
    <div class="shead"><h2 class="disp">התחרויות הקרובות</h2></div>
    <div class="list" id="upcoming"><div class="empty">טוען…</div></div>
  </section>

  <aside class="side panel" aria-label="הרשמה">
    <div class="stripe s1" aria-hidden="true"></div><div class="stripe s2" aria-hidden="true"></div>
    <h2 class="disp">הרשמה</h2>
    <a class="bigbtn" href="https://loglig.com/Activity/Form/62594?seasonId=1762" target="_blank" rel="noopener">
      <span><span><strong>רישום להתאחדות</strong><small>חברות בהתאחדות לעונת 2026/27</small></span>
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></span>
    </a>
    <a class="plink" href="#leagues"><strong>רישום לתחרויות</strong><span>הרישום לכל תחרות נמצא בדף הליגה שלה</span></a>
    <a class="plink" href="https://drive.google.com/file/d/1g0PHbWPB_pFXdqxG6ZLyZo83JNiXDOM1/view" target="_blank" rel="noopener"><strong>הסברי רישום לתחרויות</strong><span>מה צריך ואיך נרשמים, צעד אחר צעד</span></a>
  </aside>
</div>

<section id="leagues">
  <div class="shead"><h2 class="disp" style="font-size:40px;margin-bottom:4px">הליגות</h2></div>
  <div class="cards" id="cards"></div>
</section>

<section class="hero" id="hero" aria-label="תמונות מהתחרויות" style="margin-top:0">
  <div class="frames">
    <div class="fr side" id="frR"></div>
    <div class="fr mid" id="frC" aria-roledescription="carousel" aria-label="תמונות מתחלפות"></div>
    <div class="fr side" id="frL"></div>
  </div>
  <div class="ctl"><div style="display:flex;align-items:center;gap:10px"><button type="button" class="pp" id="pp"></button><div class="dots" id="dots"></div></div>
    <div class="credit" id="credit"></div></div>
</section>

</div>

<script src="assets/site.js?v=20261117b"></script>
<script>
/* Where each league card leads. Set the federation-site address of each page once it is live;
   null = page not built yet (card shows "בקרוב"). */
const LEAGUES = [
  { page: 'open',     title: 'הליגה הפתוחה', lines: ['הליגה הפתוחה לבוגרים ולבוגרות'], bar: 'var(--steel)' },
  { page: 'national', title: 'הליגה הארצית', lines: ['ליגת הילדים והנוער (U11 עד U19)', 'סימולציות מזכות (U17 ומעלה)'], bar: 'var(--slate)' },
  { page: 'elite',    title: 'ליגת העל',     lines: ['ליגת הטיפוס הבכירה בישראל'], bar: 'var(--navy)' },
  { page: 'champ',    title: 'אליפויות',     lines: ['אליפויות ישראל בבולדר ובהובלה: ילדים, נוער, בוגרים'], bar: 'var(--steel2)', go: 'לדף האליפויות' }
];
const UPCOMING_COUNT = 3;

function renderCards(){
  const el = document.getElementById('cards');
  el.innerHTML = LEAGUES.map(l => `<a class="lcard" data-page="${l.page}"><div class="bar" aria-hidden="true" style="background:${l.bar}"></div>
      <h3 class="disp">${l.title}</h3><p>${l.lines.map(x => `<span>${ILCA.esc(x)}</span>`).join('')}</p>
      <span class="go">${l.go || 'לדף הליגה'}</span></a>`).join('');
  ILCA.wireLinks(el);
}

function renderUpcoming(items){
  const next = items.filter(c => !c.status && !c.approx && ILCA.dayDiff(c.end || c.start) >= 0)
                    .sort((a, b) => ILCA.D(a.start) - ILCA.D(b.start)).slice(0, UPCOMING_COUNT);
  document.getElementById('upcoming').innerHTML = next.length ? next.map(c => `
    <article class="item">
      ${ILCA.dateBox(c)}
      <div class="body">
        <h3>${ILCA.esc(c.title)}</h3>
        <div class="vn">${ILCA.esc(c.sub)}</div>
        <div class="meta">
          <span>קטגוריות: <strong>${ILCA.esc(c.cats)}</strong></span>
          ${ILCA.regText(c)}
          ${c.hours ? `<span>שעות: <strong>${ILCA.esc(c.hours)}</strong></span>` : ''}
        </div>
        ${c.note ? `<div class="note">${ILCA.esc(c.note)}</div>` : ''}
      </div>
    </article>`).join('') : '<div class="empty">אין תחרויות קרובות כרגע.</div>';
  return next;
}

(async () => {
  renderCards();
  let cal = { items: [] }, upd = { items: [] };
  try { [cal, upd] = await Promise.all([ILCA.json('data/calendar.json'), ILCA.json('data/updates.json')]); }
  catch (e) { document.getElementById('upcoming').innerHTML = '<div class="empty">לא ניתן לטעון את רשימת התחרויות.</div>'; }
  const next = renderUpcoming(cal.items || []);
  const items = (upd.items || []).slice();
  if (next[0]) {
    const c = next[0], n = ILCA.dayDiff(c.start);
    items.push(['התחרות הבאה', `${c.title} – ${c.sub}, ${n > 1 ? 'בעוד ' + n + ' ימים' : n === 1 ? 'מחר' : 'היום'}`]);
  }
  ILCA.chyron(items);
})();

/* photo slideshow (bottom of the page): data/national-photos.json {credit, center:[{src,alt}], right:[...], left:[...]} — hidden until photos are added */
ILCA.json('data/national-photos.json').then(p => {
  if (!p || !(p.center || []).length) return;
  const hero = document.getElementById('hero'); hero.classList.add('has');
  const fill = (el, list) => { el.innerHTML = list.map((s, i) => `<img src="${s.src}" alt="${ILCA.esc(s.alt || '')}" class="${i ? '' : 'on'}" loading="lazy">`).join(''); return [...el.querySelectorAll('img')]; };
  const C = fill(document.getElementById('frC'), p.center), R = fill(document.getElementById('frR'), p.right || []), L = fill(document.getElementById('frL'), p.left || []);
  document.getElementById('credit').textContent = p.credit ? 'צילום: ' + p.credit : '';
  let c = 0, r = 0, l = 0, tick = 0, paused = false;
  try { paused = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
  const show = (arr, i) => arr.forEach((im, k) => im.classList.toggle('on', k === i));
  const dots = document.getElementById('dots');
  const drawDots = () => { dots.innerHTML = C.map((_, i) => `<button type="button" aria-label="תמונה ${i + 1} מתוך ${C.length}" aria-current="${i === c}"><span></span></button>`).join('');
    dots.querySelectorAll('button').forEach((b, i) => b.onclick = () => { c = i; show(C, c); drawDots(); }); };
  const pp = document.getElementById('pp');
  const drawPP = () => { pp.setAttribute('aria-label', paused ? 'הפעלת התמונות המתחלפות' : 'עצירת התמונות המתחלפות');
    pp.innerHTML = paused ? '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>' : '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14"></rect><rect x="14" y="5" width="4" height="14"></rect></svg>'; };
  pp.onclick = () => { paused = !paused; drawPP(); };
  drawDots(); drawPP();
  setInterval(() => { if (paused) return; tick++;
    if (tick % 2 === 0) { c = (c + 1) % C.length; show(C, c); drawDots(); }
    if (R.length && tick % 8 === 3) { r = (r + 1) % R.length; show(R, r); }
    if (L.length && tick % 8 === 7) { l = (l + 1) % L.length; show(L, l); } }, 3000);
}).catch(() => {});
</script>
</body>
</html>
